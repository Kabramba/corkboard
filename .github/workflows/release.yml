name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: # builds and tests the packages without publishing
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run dist
      - name: Add copies with stable names, so the install commands never change
        run: |
          cp release/corkboard_*_amd64.deb release/corkboard_amd64.deb
          cp release/corkboard-*.x86_64.rpm release/corkboard_x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            release/*.deb
            release/*.rpm

  test-ubuntu:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages, path: release }
      - run: sudo apt-get update && sudo apt-get install -y ./release/corkboard_amd64.deb xvfb
      - run: scripts/smoke.sh
      - run: sudo apt-get remove -y corkboard && test ! -e /opt/Corkboard/corkboard

  test-fedora:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages, path: release }
      - name: Install the package with dnf
        run: |
          cat /etc/fedora-release
          dnf install -y ./release/corkboard_x86_64.rpm xorg-x11-server-Xvfb nodejs npm procps-ng
          rpm -qi corkboard
      - name: The installed app starts and saves a board
        run: scripts/smoke.sh
      - name: Full end-to-end test on Fedora
        run: |
          npm ci
          npm run build
          xvfb-run -a npx electron scripts/e2e.cjs --no-sandbox
      - name: It uninstalls cleanly
        run: dnf remove -y corkboard && test ! -e /opt/Corkboard/corkboard

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-ubuntu, test-fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: packages, path: release }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.rpm
          generate_release_notes: true
