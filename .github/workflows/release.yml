name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run dist
      - name: Add a copy with a stable name, so the install command never changes
        run: cp release/corkboard_*_amd64.deb release/corkboard_amd64.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
          generate_release_notes: true
