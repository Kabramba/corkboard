<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corkboard</title>
</head>
<body>
<div id="viewport"><div id="world"><div id="items"></div><svg id="yarn"></svg></div></div>
<div id="dock"></div>
<div id="itembar" hidden></div>
<div id="hint">Drag the cork to move around · Ctrl + scroll to zoom · Double-click paper to write · Paste or drop anything</div>
<button id="zoom" title="Reset zoom">100%</button>
<div id="modal" hidden></div>
<input type="file" id="file" hidden multiple>
<script type="module" src="/src/main.js"></script>
</body>
</html>
